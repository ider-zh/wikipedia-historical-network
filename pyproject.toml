[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wikipedia-historical-network"
version = "0.1.0"
description = "Versioned source planning and service-free graph reconstruction for Wikipedia history"
requires-python = ">=3.11"
dependencies = ["pyarrow==26.0.0"]

[project.scripts]
whn-plan = "whn.project:main"

[tool.setuptools.packages.find]
include = ["whn*"]
